name: Desktop Kiosk Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows NSIS Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Kiosk (TypeCheck + Build + Unit/Contract Tests + Native Build)
        run: npm run verify

      - name: Publish Self-Contained Oes.WindowsAgent (win-x64)
        shell: pwsh
        run: ./scripts/build-windows-agent.ps1 -Configuration Release -Runtime win-x64 -SelfContained

      - name: Build Electron NSIS Installer
        run: npx electron-builder --win nsis

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "release\*" -File -Include *.exe,*.blockmap
          if (-not $files) {
            throw "No installer artifacts produced under release/."
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload Installer Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oral-exam-desktop-kiosk-win-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || (github.event_name != 'workflow_dispatch' && contains(github.ref_name, '-')) }}
          files: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
