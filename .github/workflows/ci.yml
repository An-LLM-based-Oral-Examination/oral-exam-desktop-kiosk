name: Desktop Kiosk CI Quality Gate

on:
  push:
    branches: [develop, main, "feature/**", "feat/**", "fix/**", "refactor/**", "chore/**", "ci/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  desktop-kiosk-ci:
    name: Desktop Kiosk Quality Gate (Electron + React 19 + .NET 8 Agent)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Kiosk Verification (TypeCheck + Build + Tests + Native Agent)
        run: npm run verify

      - name: Publish Release Native Windows Agent (win-x64)
        run: npm run build:native

  commitlint:
    name: Commit Message Linter (Conventional Commits v1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Commits with Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
